name: KetraWOS Video Render

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-videos:
    runs-on: ubuntu-latest
    env:
      HYPERFRAMES_CHROME_SANDBOX: "0"
    steps:
      - name: Repo dosyalarını al
        uses: actions/checkout@v4

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: FFmpeg ve Chrome kütüphanelerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libgbm1

      - name: Güvenlik kontrolü ve HyperFrames ile videoları üret
        run: bash ketrawos-build.sh

      - name: Üretilen iki MP4 videoyu indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: ketrawos-240x240-videos
          path: ketrawos-workspace/output/*.mp4
